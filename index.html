        function adjustTextareaHeight() {
            const scrollTop = resultText.scrollTop;
            resultText.style.height = 'auto';
            const computedStyle = getComputedStyle(resultText);
            const paddingTop = parseFloat(computedStyle.paddingTop);
            const paddingBottom = parseFloat(computedStyle.paddingBottom);
            const lineHeight = parseFloat(computedStyle.lineHeight);
            let contentHeight = resultText.scrollHeight - paddingTop - paddingBottom;
            contentHeight = Math.ceil(contentHeight * 1.1);
            const minHeight = 100;
            const maxHeight = 400;
            let finalHeight;
            if (contentHeight <= minHeight) {
                finalHeight = minHeight;
                resultText.style.overflowY = 'hidden';
            } else if (contentHeight > maxHeight) {
                finalHeight = maxHeight;
                resultText.style.overflowY = 'auto';
            } else {
                finalHeight = Math.ceil(contentHeight / lineHeight) * lineHeight;
                resultText.style.overflowY = 'hidden';
            }
            resultText.style.height = `${finalHeight}px`;
            if (scrollTop > 0) {
                resultText.scrollTop = scrollTop;
            }
        }

            let peijianShouxi = "";
            
            categoryOrder.forEach(category => {
                const items = [];
                const isHomeMode = category === "洗涤" && selectedItems["洗涤"].includes("家用机");
                
                selectedItems[category].forEach(selectedValue => {
                    const item = processes.find(p => p.category === category).items.find(i => i.value === selectedValue);

                        let fullName = item.fullName;

                        if (isHomeMode && industrialToHomeMap[selectedValue]) {

                        if (selectedValue === "配件手洗") {

                categoryContents[category] = items.join('，');

            const testReagent = categoryContents["洗前测试-试剂"];

            const testComplete = testReagent && testMethod && testResult;
            
            if (hasAnyTest && !testComplete) {
                testWarning.classList.remove('hidden');
            } else {
                testWarning.classList.add('hidden');
            }
            
            let testContent = "";
            if (testComplete) {
                testContent = `${testReagent}${testMethod}测试【部位】【*h】${testResult}`;
            }
            
            let fullContent = [];
            
            if (testContent) {
                fullContent.push(`洗前测试：${testContent}`);
            }
            
            if (categoryContents["洗前保护"]) {
                fullContent.push(`洗前保护：${categoryContents["洗前保护"]}`);
            }
            
            const preStainContents = [];
            if (categoryContents["预去渍-水洗"]) preStainContents.push(categoryContents["预去渍-水洗"]);
            if (categoryContents["预去渍-干洗"]) preStainContents.push(categoryContents["预去渍-干洗"]);
            if (preStainContents.length > 0) {
                fullContent.push(`预去渍：${preStainContents.join('，')}`);
            }
            
            const washContents = [];
            if (categoryContents["洗涤"]) washContents.push(categoryContents["洗涤"]);
            if (categoryContents["洗涤-干洗"]) washContents.push(categoryContents["洗涤-干洗"]);
            if (categoryContents["手洗"]) washContents.push(categoryContents["手洗"]);
            if (washContents.length > 0) {
                fullContent.push(`洗涤：${washContents.join('，')}`);
            }
            
            if (categoryContents["柔顺"]) {
                fullContent.push(`柔顺：${categoryContents["柔顺"]}`);
            }
            
            if (categoryContents["干燥"]) {
                fullContent.push(`干燥：${categoryContents["干燥"]}`);
            }
            
            if (categoryContents["熨烫"]) {
                fullContent.push(`熨烫：${categoryContents["熨烫"]}`);

            let newContent = fullContent.join('；');

                newContent = newContent ? `${newContent}；${peijianShouxi}` : peijianShouxi;
            }
            
            if (selectedDryWetItems.length > 0) {
                const dryWetContent = `干转水：${selectedDryWetItems.join('、')}`;
                newContent = newContent ? `${newContent}；${dryWetContent}` : dryWetContent;
            }
            
            if (selectedWetDryItems.length > 0) {
                const wetDryContent = `与编码【******】为套装衣物，需放在一起检查颜色、手感、气味差异`;
                newContent = newContent ? `${newContent}；${wetDryContent}` : wetDryContent;
            }
            
            if (currentPrefix && newContent) {
                newContent = `${currentPrefix}：${newContent}`;
            }
            
            resultText.value = newContent;
            charCount.textContent = resultText.value.length;
            adjustTextareaHeight();
            const hasContent = resultText.value.length > 0;
            copyBtn.disabled = !hasContent;
            clearBtn.disabled = !hasContent;
            if (hasContent) {
                setTimeout(() => {
                    editTip.classList.add('hidden');
                }, 3000);
            } else {
                editTip.classList.add('hidden');
            }
        }
        
        function bindPrefixButtons() {
            mainBodyBtn.addEventListener('click', () => {
                if (currentPrefix === '主体') {
                    currentPrefix = '';
                    mainBodyBtn.classList.remove('bg-primary', 'text-white');
                    mainBodyBtn.classList.add('bg-gray-100', 'text-gray-700');
                    mainBodyBtn.innerHTML = '<i class="fa fa-square-o mr-1"></i> 主体';
                } else {
                    currentPrefix = '主体';
                    mainBodyBtn.classList.remove('bg-gray-100', 'text-gray-700');
                    mainBodyBtn.classList.add('bg-primary', 'text-white');
                    mainBodyBtn.innerHTML = '<i class="fa fa-check-square-o mr-1"></i> 主体';
                    innerLiningBtn.classList.remove('bg-primary', 'text-white');
                    innerLiningBtn.classList.add('bg-gray-100', 'text-gray-700');
                    innerLiningBtn.innerHTML = '<i class="fa fa-square-o mr-1"></i> 可拆组件';
                }
                updateResult();
            });
            
            innerLiningBtn.addEventListener('click', () => {
                if (currentPrefix === '可拆组件') {
                    currentPrefix = '';
                    innerLiningBtn.classList.remove('bg-primary', 'text-white');
                    innerLiningBtn.classList.add('bg-gray-100', 'text-gray-700');
                    innerLiningBtn.innerHTML = '<i class="fa fa-square-o mr-1"></i> 可拆组件';
                } else {
                    currentPrefix = '可拆组件';
                    innerLiningBtn.classList.remove('bg-gray-100', 'text-gray-700');
                    innerLiningBtn.classList.add('bg-primary', 'text-white');
                    innerLiningBtn.innerHTML = '<i class="fa fa-check-square-o mr-1"></i> 可拆组件';
                    mainBodyBtn.classList.remove('bg-primary', 'text-white');
                    mainBodyBtn.classList.add('bg-gray-100', 'text-gray-700');
                    mainBodyBtn.innerHTML = '<i class="fa fa-square-o mr-1"></i> 主体';
                }
                updateResult();
            });
        }
        
        function bindEvents() {
            copyBtn.addEventListener('click', () => {
                resultText.select();
                document.execCommand('copy');
                copyMessage.textContent = '复制成功！';
                copyMessage.className = 'mt-1.5 p-2 rounded-lg text-center text-xs font-medium bg-green-100 text-green-800';
                setTimeout(() => {
                    copyMessage.className = 'hidden mt-1.5 p-2 rounded-lg text-center text-xs font-medium';
                }, 1500);
            });
            clearBtn.addEventListener('click', () => {
                clearAll();
                delete resultText.dataset.userEdited;
                delete resultText.dataset.quickText;
                resultText.value = '';
                editTip.classList.add('hidden');
                adjustTextareaHeight();
            });
            document.querySelectorAll('.preset-btn[data-preset], .yellow-preset-btn[data-preset], .teal-preset-btn[data-preset]').forEach(btn => {
                btn.addEventListener('click', () => {
                    applyPreset(btn.dataset.preset);
                });
            });
            document.querySelectorAll('.preset-btn[data-quick-text]').forEach(btn => {
                btn.addEventListener('click', () => {
                    applyQuickText(btn.dataset.quickText);
                });
            });
            document.querySelectorAll('.dry-wet-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    toggleDryWetSelect(btn.dataset.dryWet, btn);
                });
            });
            document.querySelectorAll('.wet-dry-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    toggleWetDrySelect(btn.dataset.wetDry, btn);
                });
            });
            resultText.addEventListener('input', () => {
                resultText.dataset.userEdited = 'true';
                charCount.textContent = resultText.value.length;
                adjustTextareaHeight();
                const hasContent = resultText.value.length > 0;
                copyBtn.disabled = !hasContent;
                clearBtn.disabled = !hasContent;
                if (hasContent) {
                    editTip.classList.remove('hidden');
                } else {
                    editTip.classList.add('hidden');
                }
            });
            window.addEventListener('resize', () => {
                adjustTextareaHeight();
            });
            bindPrefixButtons();
        }
    </script>
</body>
</html>
